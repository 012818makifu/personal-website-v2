<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>木作吊飾｜作品集</title><link rel="stylesheet" href="reader.css"></head><body><header><a href="/portfolio">返回作品集</a><a href="wood-charms.pdf" download="木作吊飾.pdf">下載 PDF</a></header><main><h1>木作吊飾</h1><figure><img src="wood-charms/1.webp" width="1600" height="900" alt="木作 吊飾 高湘芸" loading="eager"><figcaption>第 1 頁 / 共 8 頁</figcaption></figure><figure><img src="wood-charms/2.webp" width="1600" height="900" alt="設計: 三個角色的木牌垂直掛成一串，每一隻上下都有吊環可以輕 易的增減或是變換順序；除了原本雷雕的顏色，只有頭髮有 多加上他們的代表色挑染 理念: 原本只是想做一個自己偶像的作品可以陪伴自己，後來覺得 單純放在一起稍顯單調，決定三隻拆開來作，再後來看到家 裡的木頭風鈴吊飾，突然靈光一閃作成成掛成一串或單獨使 用都可以的設計；而顏色是最後加的，希望讓大家能輕鬆地 透過顏色分辨誰是誰 設 計 理 念" loading="lazy"><figcaption>第 2 頁 / 共 8 頁</figcaption></figure><figure><img src="wood-charms/3.webp" width="1600" height="900" alt="繪圖軟體操作 軟體: Clip Studio Paint(繪圖) PhotoShop(排版/轉向量圖檔) 手繪草稿 作業畫面 最終完稿" loading="lazy"><figcaption>第 3 頁 / 共 8 頁</figcaption></figure><figure><img src="wood-charms/4.webp" width="1600" height="900" alt="大致鋸出想要的形狀 用銼⼑磨平/細化 用鑽孔機鑽上需要的孔 用電燒筆加上顏⾊ 用砂盤機/⼿線鋸繼續細修 加上金屬環配件，完成! 製作過程步驟 1. 2. 3. 4. 5. 6." loading="lazy"><figcaption>第 4 頁 / 共 8 頁</figcaption></figure><figure><img src="wood-charms/5.webp" width="1600" height="900" alt="使用的工具 手線鋸 用來鋸掉比較⼤的地⽅ 銼刀 磨平邊角/細修比較複雜的地⽅ 線鋸機 電動的手線鋸" loading="lazy"><figcaption>第 5 頁 / 共 8 頁</figcaption></figure><figure><img src="wood-charms/6.webp" width="1600" height="900" alt="鑽要套金屬環等的洞 砂盤機 快速磨平；無法磨凹進去的地方 電燒筆 可在木頭上燒出顏⾊ 鑽孔機" loading="lazy"><figcaption>第 6 頁 / 共 8 頁</figcaption></figure><figure><img src="wood-charms/7.webp" width="1600" height="900" alt="成品展示" loading="lazy"><figcaption>第 7 頁 / 共 8 頁</figcaption></figure><figure><img src="wood-charms/8.webp" width="1600" height="900" alt="感想 困難:因為我的明那(中間那隻)左邊在拿到時就被 弄壞了，所以我一直很苦惱不太敢動他，加上我 有三隻，比別人多三倍的工作量讓我很怕做不完 解決:我先小心的用銼刀修明那的形狀，之後兩隻 大部分都用線鋸機，在掌握方法購線鋸機簡直比 砂盤機和銼刀砂紙快速平整多了! 所以另外兩枝 我只花了半節課就完成，簡單用線鋸機+搓刀磨 掉毛邊就很好看了 心得:做自己喜歡的東西真的很開心! 就算時間很 短但大家也都進了自己的全力，我也收到很多別 人對我的作品地稱讚。我想，之後我看到他們， 除了有看到自己偶像開心的心情，也會想到這群 超棒的朋友! 01 02 03" loading="lazy"><figcaption>第 8 頁 / 共 8 頁</figcaption></figure></main></body></html>
