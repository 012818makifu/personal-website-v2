<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>區塊鏈金融期中報告｜作品集</title><link rel="stylesheet" href="reader.css"></head><body><header><a href="/portfolio">返回作品集</a><a href="blockchain-finance.pdf" download="區塊鏈金融期中報告.pdf">下載 PDF</a></header><main><h1>區塊鏈金融期中報告</h1><figure><img src="blockchain-finance/1.webp" width="1600" height="2263" alt="1 東吳大學期中報告20261104-20261118 教師：承立平教授 課程：區塊鏈金融 BlockChain Finance 期中報告 東吳大學會計學研究所暨金融科技人工智慧應用學程 中文：區塊鏈金融 英文：BlockChain Finance 期中報告關鍵內容：區塊鏈科技發展、區塊鏈重塑產業、 區塊鏈金融重塑供應鏈 報告大綱： 主題1.區塊鏈原理與概念 主題2.區塊鏈革命與發展 主題3.區塊鏈金融相關產業 主題4.區塊鏈企業獨角獸述要 對應課程主題：區塊鏈結構與金融數位轉型 主題1 說明區塊鏈的結構與運作原理；主題2 至主題4 說明區塊鏈如 何推動支付、資產代幣化與供應鏈金融等領域的金融數位轉型。 內文： 主題1.區塊鏈原理與概念 區塊鏈的誕生背景源於金融海嘯時期。因為金融海嘯，人們對於傳統 銀行等金融機構的帳目產生極大的不信任感。因此，一個，又可能是一群 化名為中本聰的人，發布了區塊鏈的基礎代碼，透過分散式帳本來大幅降 低資料被竄改的可能性。 首先，在中本聰發布的原始碼中，主要核心使用的就是雜湊值。當人 們把資料打包成一塊一塊的區塊，放進區塊鏈後，這些區塊會被雜湊函數" loading="eager"><figcaption>第 1 頁 / 共 9 頁</figcaption></figure><figure><img src="blockchain-finance/2.webp" width="1600" height="2263" alt="2 串連在一起。雜湊函數的特質就是同樣的輸入會得到一樣的輸出，全部的 區塊像是鏈條一樣被數學公式串接起來；只要其中一個區塊被竄改，那麼 它之後的每一個區塊都會跟著改變。在雜湊函數的運作下，加上每個節點 都有原先的帳本，讓竄改資料在如今的科技下幾乎不可能。 接下來，共識機制讓我們知道誰該寫下一個區塊。像是比特幣採用的 是PoW（工作量證明），誰先找出下一個區塊就能取得這個區塊的記帳 權並獲得獎勵；而只有過半的算力倒戈才能改寫紀錄，這讓互不信任的節 點也能達成共識，解決了拜占庭將軍問題。PoW 耗時耗電，但是透過犧牲 運算速度來換取使用者的信心。另一種共識機制，PoS（權益證明），是 依照質押代幣的多寡選出驗證者，作弊的驗證者會被沒收質押的代幣，用 經濟懲罰取代算力競爭。使用罰金而非算力、能源消耗來維持秩序是它和 PoW 不一樣的地方。以太坊在2022 年的合併就是從PoW 轉為PoS。至於 私有的許可鏈，因為參與者身分已知，多半使用效率較高的投票式共識。 最後，智能合約讓區塊鏈實現自動化，真正的去中心化。透過在區塊 鏈上預先編寫的程式，當條件達成就能自動執行，讓區塊鏈能真正省成 本、透明公開，不需要人工介入。不過，這種程式一旦部署就很難修改， 如果有漏洞，損失也會被迫自動發生。2016 年以太坊上的The DAO 專案 就因合約漏洞被駭，損失約五千萬美元，最後甚至導致以太坊分裂成兩條 鏈。 而在使用區塊鏈時，使用者會拿到一串金鑰，包含一組公鑰和一組私 鑰。公鑰是該使用者的公開地址，而私鑰是必要的密碼，一旦遺失無法找 回。因此，我們至今仍難以估計現存的能流動的比特幣還剩多少枚，因為 有不少私鑰可能已經被遺失。因此，有些託管機構與交易所，可以替不想 自己保管私鑰的使用者提供管理服務。" loading="lazy"><figcaption>第 2 頁 / 共 9 頁</figcaption></figure><figure><img src="blockchain-finance/3.webp" width="1600" height="2263" alt="3 此外，依照誰可以參與，區塊鏈可以分成三種：公有鏈、私有鏈與聯 盟鏈。公有鏈完全公開、自由加入，但是交易速度慢，資料也透明。私有 鏈由單一機構控制，概念上就是個加密保護的資料庫。聯盟鏈則介於兩者 之間，由多家機構共同維護，只有經過許可的成員能記帳，適合銀行間或 供應鏈上下游的合作。 整體來說，去中心化、不可竄改、透明可追溯是區塊鏈最核心的三個 特性，也是後面各種金融與產業應用的基礎。但同時，區塊鏈也必須在效 率、隱私與去中心化之間做取捨，這也是不同類型的鏈和應用方式會產生 的原因。 主題2.區塊鏈革命與發展 區塊鏈的發展早期集中在虛擬貨幣上。 在2008 年，中本聰發表了比特幣白皮書。它把工作量證明、雜湊鏈 和點對點網路組合起來，第一次能夠越過中間商解決雙重支付問題。2009 年，比特幣創世區塊產生。接下來，直至2021 年左右，加密貨幣逐漸走 向全盛時期；2014 年第一個被大規模使用的美元穩定幣USDT 推出、 2015 年以太坊引入了智能合約、2018 年USDC 被推出，而在2020 年 Compound 開始發放COMP，帶動流動性挖礦和DeFi，促成幣圈全盛時 期。約在同時期，NFT 也開始活躍在大眾面前。 在虛擬貨幣市場越來越火熱的時候，2022 年的兩起毀滅性打擊事件， 讓幣圈開始被檢討、改造，不再只是狂熱者的賭博場。 首先，是Terra（LUNA）與演算法穩定幣TerraUSD（UST）的崩 盤；在設定上，UST 錨定一美元，同時1 UST 可兌換價值1 美元的 LUNA。UST 遭到大量拋售而脫鉤。協議自動開始增發大量LUNA，" loading="lazy"><figcaption>第 3 頁 / 共 9 頁</figcaption></figure><figure><img src="blockchain-finance/4.webp" width="1600" height="2263" alt="4 LUNA 價格從曾經高點100 多美元一路狂跌至趨近於零。而在最後，死亡 螺旋引發加密貨幣市場暴跌，創辦人Do Kwon 領導的Luna 基金會護盤失 敗，面臨法律訴訟。在這起事件之後，全世界與加密貨幣有關的立法更加 嚴格且完備。 在同年年底，FTX 倒閉，此為第二起打擊。2022 年11 月2 日，老牌 的區塊鏈與加密貨幣媒體《CoinDesk》發表文章，內容指出FTX 和姐妹 公司Alameda Research 帳目不清，且存在可能的負債問題。在11 月9 日，隨著FTX 被收購的可能性歸零，大量做空以及客戶的提款要求蜂擁 而來。數十小時內蒸發了FTX 數十億美金的資金，連帶比特幣24 小時內 下跌15.8%。 在這兩起事件之後，幣圈開始往合規以及降低成本的目標改進。2022 至2023 年左右，各國政府紛紛透過監管透明化、參與來介入虛擬貨幣體 系。例如歐盟在2023 年通過了MiCA（加密資產市場規範），是全世界 第一部完整的加密貨幣監管框架。而降低成本的部分，以太坊在2022 年 完成合併（The Merge），改用權益證明，大幅降低能源消耗；2024 年 Dencun 升級（EIP-4844），大幅降低擴容層的成本。 接下來，在2024 年，美國核准比特幣現貨ETF，傳統資產管理公司 正式發行加密資產商品。2025 年，美國《GENIUS Act》法律被簽署，是 穩定幣聯邦層級的法律框架。而在同年年底，DTCC 開放將DTC 託管的 美國公債代幣化。2026 年7 月，Swift 的區塊鏈帳本開始使用，來自六大 洲的17 家銀行準備用代幣化存款試行24 小時跨境支付。而同年台灣三讀 通過了《虛擬資產服務法》。 至於鏈圈的發展，隨著幣圈帶動的技術升級跟著熱絡起來。" loading="lazy"><figcaption>第 4 頁 / 共 9 頁</figcaption></figure><figure><img src="blockchain-finance/5.webp" width="1600" height="2263" alt="5 在2012 到2016 年間，有些機構或是政府單位開始嘗試私有鏈來儲存 資料。像是愛沙尼亞，在2012 年開始用KSI 區塊鏈技術保護政府登錄資 料的完整性，為第一個引入區塊鏈進入政府機關的國家。 時間來到2017 到2019 年間，企業間開始嘗試組成聯盟鏈。常見的應 用是在追蹤商品來源與軌跡，例如2016 年Walmart 測試利用供應鏈追溯 芒果來源，之後擴展到生菜；MediLedger 聯盟用區塊鏈處理美國藥品供應 鏈的追溯法規要求；或是De Beers 推出Tracr，用以追蹤鑽石從礦場到零 售市場的來源。此外，在這個時期也有不少機構開始嘗試使用區塊鏈進行 交易。像是匯豐銀行、ING 銀行以及美國食品與農產品集團Cargill 合作， 透過R3 聯盟開發的區塊鏈平台，完成了全球第一筆端對端即時貿易融資 與商業信用狀交易。另一方面，在法務、行政方面，區塊鏈的可信度也顯 著增加。譬如在2018 年中國最高法院承認區塊鏈存證可以作為電子證 據，而台灣的財金資訊公司，在同年推出了金融區塊鏈函證服務。 接下來，受到2022 年幣圈崩盤的影響，以及營運成本無法回收等問 題，許多大型聯盟式區塊鏈貿易平台集體退場。在相近的時間，澳洲證交 所放棄了用區塊鏈改造結算系統，認列大筆的損失。但是同時，有許多機 構嘗試使用區塊鏈代幣化存款、債券與公債。例如紐約梅隆銀行在2026 年在其數位平台上將客戶存款餘額上鏈，是代幣化存款的第一步。可以發 現，在後期，比起用區塊鏈改善流程，更多的是用它重新發行數位資產。 主題3.區塊鏈金融相關產業 區塊鏈技術除了為基礎區塊鏈建設行業提供收入，也帶動升級傳統金 融產業的服務以及效率。依照網路資料，我自行將相關產業分成四部分敘 述：底層技術的基礎建設、交易數位資產的服務業，被區塊鏈影響的傳統 金融業以及供應鏈。" loading="lazy"><figcaption>第 5 頁 / 共 9 頁</figcaption></figure><figure><img src="blockchain-finance/6.webp" width="1600" height="2263" alt="6 1. 基礎建設 第一部分，是提供「鏈」本身的技術、安全性維護的生意。公有鏈的 代表有例如以太坊、Solana，這些平台讓開發者能自行發行代幣、撰寫合 約。而面對企業端，有Hyperledger Fabric、R3 Corda 這類許可制的聯盟鏈 框架。供應鏈追溯和貿易融資的主要程式就是以這些框架為基底。此外， 礦工和驗證者也是基礎建設重要的一環。近年來，隨著區塊鏈蓬勃發展， 區塊鏈分析這個獨特的產業也隨之誕生。不只是投資情報，反洗錢、犯罪 追查甚至是跨鏈追蹤都是執法部門與民間企業投入這個區塊的原因之一。 2. 交易服務業 這一部分是讓一般民眾與區塊鏈服務接觸的中間商，像是託管機構、 代幣發行商、交易所。在過去，他們許多是處於灰色地帶，但隨著虛擬貨 幣價值與交易量創新高，他們逐漸成為揭露財報、受到監管的企業。如 2021 年Coinbase 在那斯達克掛牌（在美國大型交易所上市的第一家）、 USDC 的發行商Circle 也在2025 年於紐約證交所上市。 回到台灣，在過去，這種虛擬資產業者只需要完成洗錢防制登記。但 是在《虛擬資產服務法》通過後，政府對業者的資本額、顧客資產安全以 及資訊安全都會有更高的標準。 3. 傳統金融業 第三部分是受區塊鏈影響的金融業。他們主要透過區塊鏈來改進帳 本，或是嘗試轉型部分金融商品。 像是摩根大通成立的Onyx，後改名成Kinexys，讓顧客能即時地用區 塊鏈進行美金轉帳和附買回交易，之後更在公有鏈推出存款代幣。 而Swift 近期與多家大型銀行推出區塊鏈共享帳本。參與銀行在自家 帳本上發行代幣化存款，透過共享帳本即時完成支付承諾與協調，使跨境" loading="lazy"><figcaption>第 6 頁 / 共 9 頁</figcaption></figure><figure><img src="blockchain-finance/7.webp" width="1600" height="2263" alt="7 支付從過去需要一到兩天處理時間，邁向全天候即時轉帳，大幅減少銀行 在各地往來帳戶預存的沉澱資金。 在現今的銀行業中，對區塊鏈的應用主要還是集中在資產代幣化，以 達成全天候交易與碎股化，也就是鏈圈後期的主要發展。 4. 供應鏈金融 在課堂上，我學到最大的部分便是區塊鏈對於中小微型供應商的影響 力。藉由有高度可信度的，儲存在區塊鏈中的過往交易資料，這些供應商 藉由這些提高銀行與下游核心企業的信任度，以獲取更大的借貸額度、談 判空間。像是中國的螞蟻集團，旗下的雙鏈通平台，能以核心企業的應付 帳款與真實貿易背景為依託，將應收帳款轉化為數位信用憑證，讓核心企 業的信用在區塊鏈上逐級拆分、流轉給多級供應商。 不過，從過去聯盟式貿易平台陸續退場的經驗來看，供應鏈金融平台 的主要問題在於有沒有夠多的企業一起加入。多數此類平台最後退場的原 因在於因參與者太少而無法回收成本，並非技術原因。 主題4.區塊鏈企業獨角獸述要 「獨角獸」嚴苛的定義指的是尚未上市、估值超過10 億美元的新創 公司。主題3 提到的Coinbase、Circle 雖然規模很大，但都已經上市，所 以不能算。因此，為了符合「區塊鏈」的主題，我選擇了尚未上市但是估 值有達標的Ripple 與Chainalysis，並補充台灣的情況。 1.Ripple：用區塊鏈做跨境匯款 Ripple 成立於2012 年，總部在美國舊金山，主要業務是提供銀行與 金融機構跨境支付的解決方案。傳統的跨境匯款在不同銀行間的系統作業 得花一到兩天，銀行也必須在各國的往來帳戶裡預先存放大量沉澱資金。" loading="lazy"><figcaption>第 7 頁 / 共 9 頁</figcaption></figure><figure><img src="blockchain-finance/8.webp" width="1600" height="2263" alt="8 Ripple 的做法是以自家發行的加密貨幣XRP 作為「橋接資產」；運 作方式就是匯款方先把本國貨幣換成XRP，透過區塊鏈送到對方國家，再 換回當地貨幣。透過這個方式，交易可以在數秒內完成，銀行也不需要事 先在各地存放資金。這和主題3 提到的Swift 共享帳本是同一個概念，可 以說Ripple 是Swift 在這個領域的挑戰者，也能說明這種透過虛擬貨幣進 行跨國轉帳已經是如今的趨勢。 Ripple 曾經遇上的最大麻煩是關於證券法規的法律問題。2020 年底， 美國證券交易委員會（SEC）控告Ripple 銷售XRP 的行為，屬於未註冊 的證券發行。這場官司打了將近五年，許多美國交易所在這個期間一度下 架XRP。2023 年判決結果出爐，法院認為在交易所上賣給一般人的XRP 不算證券。2025 年雙方撤回上訴，訴訟才告一段落。 官司結束後，Ripple 開始積極擴張版圖：2024 年底推出自家的美元穩 定幣RLUSD，2025 年收購主要經紀商Hidden Road，從單純的支付公司 走向更完整的機構金融服務。2025 年11 月，Ripple 以400 億美元的估值 募得5 億美元；2026 年3 月更以500 億美元的估值回購員工與投資人手上 的股份，成為全球估值最高的未上市公司之一。 2.Chainalysis：區塊鏈上的偉大偵探 Chainalysis 成立於2014 年，總部在美國紐約，是主題3 提到的「區 塊鏈分析」產業中的龍頭。雖然區塊鏈上的交易都是公開的，但帳戶只是 一串地址，不知道真正的操作者是誰。Chainalysis 的核心技術，是透過分 析資金流向和交易模式，把匿名地址和交易所、詐騙集團、駭客等真實身 分連結起來。它的客戶包括各國執法機關、稅務單位、交易所與銀行，用 途涵蓋反洗錢、犯罪調查與交易所的審查。美國司法部追查重大加密貨幣 駭客案時，也曾使用它的工具。" loading="lazy"><figcaption>第 8 頁 / 共 9 頁</figcaption></figure><figure><img src="blockchain-finance/9.webp" width="1600" height="2263" alt="9 Chainalysis 的估值幾乎跟隨著幣圈的起落。在加密貨幣的全盛時期， 它在2021 年估值先後達到20 億與42 億美元，2022 年更以86 億美元的估 值，完成F 輪募資。但隨後碰上前面提到的LUNA 與FTX 崩盤，幣圈進 入寒冬，Chainalysis 在2023 年進行了兩輪裁員，將近20%的員工。根據 次級市場的資料，它目前的估值大約只剩15 億美元左右，雖然仍在獨角 獸的門檻裡，但和最頂峰比起來縮水超過80%。 不過，它的業務和區塊鏈活躍度有直接關係，所以它的估值才會被影 響。主題2 提到各國監管越來越嚴格，交易所與銀行對合規工具的需求只 會增加，這也是區塊鏈分析產業這個長期的成長動力。長期來看這間公司 也是未來可期。 3.補充：台灣的情況 台灣至今沒有嚴格定義下的區塊鏈獨角獸，Appier 和Gogoro 曾經是 最接近這個定義的公司。 其中，Appier 沛星互動科技成立於2012 年，是一家以人工智慧協助 企業做精準行銷的軟體公司，例如預測哪些顧客可能購買、應該在什麼時 間推播什麼廣告。它在2021 年3 月於東京證券交易所上市，上市時市值 約17 億美元，是台灣新創走向國際資本市場的代表案例。不過，沛星屬 於AI 產業，與區塊鏈並無直接關係。 台灣之所以難以出現區塊鏈獨角獸，可能和下列因素有關：市場規模 較小、虛擬資產相關法規不完備，以及最重要的，台灣的資金與人才長期 集中在半導體等硬體產業。隨著《虛擬資產服務法》通過，業者有了明確 的法律地位，未來是否能培養出本土的區塊鏈獨角獸，值得我們持續觀 察。 貿二A 高湘芸" loading="lazy"><figcaption>第 9 頁 / 共 9 頁</figcaption></figure></main></body></html>
