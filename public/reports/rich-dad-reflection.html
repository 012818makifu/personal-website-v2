<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>關於《富爸爸，窮爸爸》的反思｜作品集</title><link rel="stylesheet" href="reader.css"></head><body><header><a href="/portfolio">返回作品集</a><a href="rich-dad-reflection.pdf" download="關於《富爸爸，窮爸爸》的反思.pdf">下載 PDF</a></header><main><h1>關於《富爸爸，窮爸爸》的反思</h1><figure><img src="rich-dad-reflection/1.webp" width="1600" height="900" alt="高湘芸 關於 《富爸爸，窮爸爸》 的反思" loading="eager"><figcaption>第 1 頁 / 共 21 頁</figcaption></figure><figure><img src="rich-dad-reflection/2.webp" width="1600" height="900" alt="目錄 主題說明 動機 從書中我得知的... 在此報告中包含... 作者及書本簡介 關於作者:羅伯特·徹·清崎 內容摘錄 我的心得 我的省思 對我來說 我的觀點 討論議題-不認同的地方 書中的理念缺乏對於風險的討論 社會狀況 關於作者 學習與收穫 延伸學習 財經課程 實際&quot;投資&quot;" loading="lazy"><figcaption>第 2 頁 / 共 21 頁</figcaption></figure><figure><img src="rich-dad-reflection/3.webp" width="1600" height="900" alt="主題說明 我在很小的時候就看了很多爸爸的藏書，包括這本，不 過是看得一知半解，只記得劇情不記得其授予的知識。在老 師說要製作閱讀新的報告時，我剛好看到關於作者的新聞， 意外發現了這本書的許多爭議，再重新閱讀後果然有許多我 不認同的地方，因此決定利用這次機會好好整理此書內容 動機" loading="lazy"><figcaption>第 3 頁 / 共 21 頁</figcaption></figure><figure><img src="rich-dad-reflection/4.webp" width="1600" height="900" alt="從書中我得知的... 富爸爸代表了積極主動的理財方式，他強調投資、創業和資 產累積的重要性，勉勵讀者要讓錢為自己工作，實現財務自由。 相反，窮爸爸則象徵著傳統僱傭觀念，依賴穩定薪水生活，突顯 僅依賴薪水可能難以實現真正財務獨立。 書中提及的一個核心概念是資產與債務的運用。富人不僅擁 有更多資產，還能有效運用債務進行投資，而這種觀點成為實現 財務成功的關鍵。同時，書中強調教育體系的不足，呼籲人們僅 依靠學校學得的知識是不足已變成有錢人的。" loading="lazy"><figcaption>第 4 頁 / 共 21 頁</figcaption></figure><figure><img src="rich-dad-reflection/5.webp" width="1600" height="900" alt="在此報告中包含... 作者及書本介紹 我學到的地方 我不認同的地方 我的反思 關於理財我的其他學習" loading="lazy"><figcaption>第 5 頁 / 共 21 頁</figcaption></figure><figure><img src="rich-dad-reflection/6.webp" width="1600" height="900" alt="作者及書本簡介 書籍ISBN: 9789861853253 中文書名: 富爸爸，窮爸爸 書籍作者: 羅伯特 · T · 清崎 、 莎朗 · L · 萊希特 書籍編譯者: 楊軍、楊明 出版單位: 高保書版 出版年月: 2009年1月 版次: 3版" loading="lazy"><figcaption>第 6 頁 / 共 21 頁</figcaption></figure><figure><img src="rich-dad-reflection/7.webp" width="1600" height="900" alt="關於作者:羅伯特·徹·清崎 清崎的父親是夏威夷州教育部的教師，曾經是該地教育部長。他先 在紐約攻讀大學，畢業後曾加入美國海軍陸戰隊，參加過越戰。退伍後 曾入讀航海學校，之後在富爸爸提議下，加入全錄公司，然而推銷工作 成績強差人意。在富爸爸鼓勵下，他除了工作，亦為慈善機構以致電陌 生人方式募捐，推銷技巧突飛猛進，登上全錄公司最佳營業額第一位。 1977年，清崎在工餘時間創辦「衝浪者」錢包的企業不斷成長， 令他毅然全職投身企業，更曾一度致富。然而合作拍檔在成功之後變得 鬆懈以至他決定離開，後又在拍檔請求下，為拯救公司而再次加入，最 後由於不斷有仿冒品出現，打擊尼龍生意，公司最終難逃倒閉命運。 資料來源:維基百科" loading="lazy"><figcaption>第 7 頁 / 共 21 頁</figcaption></figure><figure><img src="rich-dad-reflection/8.webp" width="1600" height="900" alt="雖然如此，清崎徹仍然堅持開設公司。經過九個月無收入睡在車子 裡的艱難日子後，創業終於成功，包括在中國、委內瑞拉等地，收購或 開設石油公司等。其中房地產收入豐碩，更令他明白到現金流對致富極 為關鍵，亦成為他在「富爸爸」系列中，一再強調的致富方法。最後他 在47歲時，與妻子金一同達成財務自由，兩人更到斐濟度假慶祝。 退休生活期間，清崎徹決定成為老師，希望透過遊戲，將致富心得 廣為傳授，便在深山隱居兩年，專心鑽研與理財有關的遊戲。1985年， 「現金流遊戲」（CASHFLOW GAME）終於面世。為更容易向大眾介紹 該遊戲概念，他開始執筆撰寫「富爸爸·窮爸爸」，結果大受歡迎，連 續六年成為紐約時報最暢銷書籍。因此他隨後更與友人合作創辦一家國 際教育公司「富爸爸理財教育」，配合現金流遊戲，教授理財觀念，並 曾主持電視節目。" loading="lazy"><figcaption>第 8 頁 / 共 21 頁</figcaption></figure><figure><img src="rich-dad-reflection/9.webp" width="1600" height="900" alt="「學校是非常非常重要的地方。在學校,你學習一種技術或 一門專業,成為對社會有益的人。每一種文明都需要教師、醫 生、工程師、藝術家、廚師、商人、警察、消防隊員、士兵 等。學校培養了這些人才,所以我們的社會可以興旺發達。但不 幸的是,對許多人來說,學校是終止而不是開端。」 內容摘錄 p.083" loading="lazy"><figcaption>第 9 頁 / 共 21 頁</figcaption></figure><figure><img src="rich-dad-reflection/10.webp" width="1600" height="900" alt="我的心得" loading="lazy"><figcaption>第 10 頁 / 共 21 頁</figcaption></figure><figure><img src="rich-dad-reflection/11.webp" width="1600" height="900" alt="我的省思 這本書中提到了理財知識和財務IQ等的重要性，以及批評 教育體系對於理財教育的不足。這一點引起了我對於教育的反 思。現行教育體系主要注重將學生培養為優秀的員工，卻鮮有涉 及投資、創業和理財方面的知識。這種不平衡可能導致一些人在 進入社會後缺乏實際的理財能力。 「教育體系是在幫企業(有錢人)培養優秀的員工」，這點在為 了好工作而學習的人我認為很真實。在我學習了理財知識後，我 也才發現也許不一定要為了好找工作而考上某些科系，如果能做 好理財規劃的話，養活自己可能並沒有想像中困難。" loading="lazy"><figcaption>第 11 頁 / 共 21 頁</figcaption></figure><figure><img src="rich-dad-reflection/12.webp" width="1600" height="900" alt="對我來說 從作者的生長環境中，我覺得我和作者學習理財知識的動機十分相 似。我和作者都是曾經在貴族學校讀書的普通孩子，在認識到所謂&quot;有錢 人的世界&quot;後，我也一直在了解為何有同學的爸媽能白手起家，從受薪階 級翻身變成給薪階級，而有些人為何會一夕之間家破人亡。 因此，能看到這本書對我更像是個提醒，在看書中的案例時我常和 以前同學吐槽書中內容，在之前和他們上學時，有錢人的孩子就算是成 績不好，對於商政時事也都有比普通人更多的了解。在看了這本以&quot;普通 人&quot;為視角的書後，我也不斷提醒自己有錢人做的並不比想像中少，不能 如此草率的判斷投資方向。" loading="lazy"><figcaption>第 12 頁 / 共 21 頁</figcaption></figure><figure><img src="rich-dad-reflection/13.webp" width="1600" height="900" alt="我的觀點 在閱讀時，我發現這是本煽動性很強的書，可能是因為他的書名和 知名度，會吸引到許多從來沒有了解過投資的人群，但是他又像詐騙集 團般把高風險投資說得十分美好，&quot;就是因為沒學習才會用辛苦的方式工 作&quot;、&quot;多失敗才會成功&quot;這種概念在書本的中後段十分明顯，讓我一度思 考這本書是否有繼續閱讀的必要性。 不過在閱讀完後，我也能理解這本書出名的原因，淺顯易懂的對話說 明+真實故事和案例(雖然後座者也承認富爸爸是虛構的人物)+成功者有如 老師的語氣和視角(雖然我看的很不耐煩)，讓大家都能理解富人的賺錢方 式，產生了嚮往，但是缺乏對於危機的討論可能反而讓不了解的人陷入 財務危機中。" loading="lazy"><figcaption>第 13 頁 / 共 21 頁</figcaption></figure><figure><img src="rich-dad-reflection/14.webp" width="1600" height="900" alt="而說到這本書我認為值得學習的地方，第一點是先現金流的概 念。透過了解不同階級的人們創造的現金流，可以很清楚的知道他 們對待金錢的不同方式和看法。 第二點是對自己的投資，我從來沒想過把對自己的投資和普通 的投資放在一起想過，但現在想想，當初被送去貴族學校而開拓的 視野、人脈，是父母給我的很棒的投資之一。書中有提到每年要投 資自己的財務智商，對我來說是個很棒的建議。" loading="lazy"><figcaption>第 14 頁 / 共 21 頁</figcaption></figure><figure><img src="rich-dad-reflection/15.webp" width="1600" height="900" alt="討論議題-不認同的地方" loading="lazy"><figcaption>第 15 頁 / 共 21 頁</figcaption></figure><figure><img src="rich-dad-reflection/16.webp" width="1600" height="900" alt="當初我在閱讀時，發現作者非常鼓勵讀者「勇於投資」、「投資就會 賺大錢」，並且似乎十分推薦高風險的股票類型和房地產等。雖然這類型 的收益會很高，但這些對於一般人來說其實是玩不起的，周遭也不少投 資最後家破人亡的新聞。書中給的房地產成功案例，甚至給我那種詐騙 集團營造的美夢的感覺，讓我覺得有點恐怖。 而作者提到共同基金時，認為它是沒有理財知識又懶著學習的中產 階級才會購買的，但在我看來，共同基金風險、金額都比較小，對於普 通的家庭和上班族其實非常適合；至少我認為，並不是每個人都適合走 高報酬高風險的路線，自己負擔的起才是最重要的。 書中的理念缺乏對於風險的討論" loading="lazy"><figcaption>第 16 頁 / 共 21 頁</figcaption></figure><figure><img src="rich-dad-reflection/17.webp" width="1600" height="900" alt="在這本書裡，作者十分推崇資本家，也就是富爸爸，而一直貶低普 通的受薪階級，也就是窮爸爸，養育他長大的親生父親，嘲弄的語氣和 描述方式讓我也些不適，而追捧資本家的寫法，則讓我不斷想起那些個 很想成為上流階級，每天跟在少爺小姐後頭的同學。 撇除對待父母的方式這點來看，這個世界上每個階層的人都需要， 沒有受薪階級的人們資本家就不會存在，許多作者看來「學習了這麼久 也賺不到什麼錢」的專業知識，也是帶領著社會進步的主要動力。我覺 得，學會投資會對我們的生活有很大的助益，但並非人人都要成為資本 家。 社會狀況" loading="lazy"><figcaption>第 17 頁 / 共 21 頁</figcaption></figure><figure><img src="rich-dad-reflection/18.webp" width="1600" height="900" alt="作者在他的第一本書《如果你想變有錢又快樂，別去上學》上曾說 他的親生父親是世界上最好的老師，在後來出版的《富爸爸窮爸爸》書 中他的親生父親卻成了他口中的「窮爸爸」。自此之後，他就一直聲稱 「富爸爸」是真有其人，要求出版社歸類為「非虛構書籍」。在記者不斷 地抽絲剝繭，終於在2003年SmartMoney雜誌專訪的時候，羅伯特清崎 親自說道：「難道哈利波特是真的嗎？何不讓富爸爸成為一個傳說故事， 就像哈利波特一樣？」 另外，根據Forbes富比士雜誌的調查指出，在1997年之前羅伯特 清崎其實根本不富有，直到他1985年發展出「現金流遊戲」、甚至寫出 《富爸爸窮爸爸》之前，都沒有足夠證據顯示他曾靠房地產致富。 最後，他們在第三次公司破產後靠著&quot;理財知識&quot;惡意破產以逃避賠 償金，完美示範了書中「破產是種策略」的原則。 關於作者" loading="lazy"><figcaption>第 18 頁 / 共 21 頁</figcaption></figure><figure><img src="rich-dad-reflection/19.webp" width="1600" height="900" alt="學習與收穫 在這本書中，我除了地到了關於理財的新觀點和知 識，我也學習到投資必須要有的思辨和分析。諾貝爾經濟 學獎得主薩謬爾森說過：「沒有任何書籍可以讓你致富， 少有書可以讓你保持富有狀態，但卻有很多書加速你的財 富虧損。」對我來說，這本書只能讓人打開思維，照做的 話大概率會加速財富虧損，但是對我來說不管是作者本人 的經歷，或是這本書會暢銷的原因，都是很有趣很適合探 討的一環。很高興有機會能對這本書做了簡單的探討，無 論是正面還是反面的面向都讓我有所長進，我也會謹記學 到的知識，持續增進我的理財能力。" loading="lazy"><figcaption>第 19 頁 / 共 21 頁</figcaption></figure><figure><img src="rich-dad-reflection/20.webp" width="1600" height="900" alt="在某一堂的財經課程，老師讓我們實際計算 怎麼&quot;存錢&quot;才會有更高的收益，而我也實際把 今年的紅包買了基金和定存，希望這些投資能 給我的未來帶來實質的幫助! 延伸學習 我在這個學期的自主學習時間，選修了財經 相關的微課程。在課程中我學到很多，尤其是創 咖啡的創辦人楊育明老師的課，除了他超強的投 資眼光和比小說還精采的人生故事外，他告訴我 們投資的理念:&quot;想像未來十年的世界，去看看哪 些公司在推動著世界的發展，並且去認識他們背 後的故事__就像是如今許多的大公司一樣，沒有 信念支撐而只是想賺錢的話是走不遠的。&quot; 實際&quot;投資&quot; 財經課程" loading="lazy"><figcaption>第 20 頁 / 共 21 頁</figcaption></figure><figure><img src="rich-dad-reflection/21.webp" width="1600" height="900" alt="Thank You" loading="lazy"><figcaption>第 21 頁 / 共 21 頁</figcaption></figure></main></body></html>
